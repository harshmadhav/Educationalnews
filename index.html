<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyBrief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D; --paper:#FAFAF7; --paper-dim:#F0EEE6;
    --amber:#F2A93B; --teal:#1F7A70; --coral:#D9542A; --violet:#5B5F97;
    --meta:#6B7280; --line:#E4E1D8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F4F2EA; --paper:#12131A; --paper-dim:#1A1C25;
      --meta:#9A9AA5; --line:#2A2C36;
    }
  }
  :root[data-theme="dark"]{
    --ink:#F4F2EA; --paper:#12131A; --paper-dim:#1A1C25;
    --meta:#9A9AA5; --line:#2A2C36;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky; top:0; z-index:10; background:var(--paper);
    border-bottom:1px solid var(--line); padding:14px 16px 0;
  }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .brand{
    font-family:'Source Serif 4',serif; font-weight:700; font-size:1.3rem; margin:0;
  }
  .load-btn{
    font-size:.78rem; font-weight:600; color:var(--ink); background:var(--paper-dim);
    border:1px solid var(--line); border-radius:16px; padding:6px 12px; cursor:pointer;
    font-family:inherit;
  }
  .header-actions{ display:flex; gap:8px; align-items:center; }

  /* --- Customize modal --- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,33,61,.5);
    z-index:50; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    background:var(--paper); width:100%; max-width:480px; max-height:82vh;
    border-radius:16px 16px 0 0; display:flex; flex-direction:column;
    padding:20px; box-sizing:border-box;
  }
  @media (min-width:560px){
    .modal-overlay{ align-items:center; }
    .modal{ border-radius:16px; max-height:78vh; }
  }
  .modal-header{ display:flex; justify-content:space-between; align-items:center; }
  .modal-header h2{
    font-family:'Source Serif 4',serif; font-size:1.15rem; margin:0;
  }
  .modal-close{
    background:none; border:none; font-size:1.4rem; line-height:1; cursor:pointer;
    color:var(--meta); padding:0 4px;
  }
  .modal-sub{ font-size:.85rem; color:var(--meta); margin:8px 0 16px; }
  .modal-body{ overflow-y:auto; flex:1; }
  .interest-group{ margin-bottom:18px; }
  .interest-group h3{
    font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
    color:var(--meta); margin:0 0 8px;
  }
  .interest-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .interest-chip{
    font-size:.82rem; padding:6px 12px; border-radius:14px; border:1px solid var(--line);
    background:transparent; color:var(--ink); cursor:pointer; font-family:inherit;
  }
  .interest-chip.selected{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .modal-footer{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
  }
  .btn-text{
    background:none; border:none; color:var(--meta); font-size:.85rem;
    cursor:pointer; font-family:inherit; text-decoration:underline;
  }
  .btn-primary{
    background:var(--ink); color:var(--paper); border:none; border-radius:20px;
    padding:9px 22px; font-size:.9rem; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .pull-indicator{
    text-align:center; font-size:.78rem; color:var(--meta); padding:0; height:0;
    overflow:hidden; transition:height .15s ease; max-width:480px; margin:0 auto;
  }
  .pull-indicator.show{ height:34px; padding-top:8px; }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:var(--paper); font-size:.82rem; font-weight:500;
    padding:10px 18px; border-radius:20px; opacity:0; transition:all .25s ease;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; padding:7px 14px; border-radius:20px; border:1px solid var(--line);
    background:transparent; color:var(--ink); font-size:.85rem; font-weight:500;
    cursor:pointer; white-space:nowrap; font-family:inherit;
  }
  .tab.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .feed{
    max-width:480px; margin:0 auto; height:calc(100vh - 78px);
    overflow-y:auto; scroll-snap-type:y mandatory;
  }
  .card{
    scroll-snap-align:start; min-height:calc(100vh - 78px);
    display:flex; flex-direction:column; padding:20px 18px 28px;
    border-bottom:1px solid var(--line);
  }
  .thumb{
    height:170px; border-radius:10px; display:flex; align-items:flex-end;
    padding:12px; margin-bottom:16px; position:relative; overflow:hidden;
  }
  .thumb-art{
    position:absolute; inset:0; width:100%; height:100%;
  }
  .thumb-photo{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .thumb-actions{
    position:absolute; top:10px; right:10px; z-index:1; display:flex; gap:6px;
  }
  .icon-btn{
    width:32px; height:32px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(0,0,0,.32); color:#fff; display:flex; align-items:center;
    justify-content:center; backdrop-filter:blur(2px);
  }
  .icon-btn:hover{ background:rgba(0,0,0,.46); }
  .icon-btn.active{ color:var(--amber); }
  .empty-saved{
    padding:60px 24px; text-align:center; color:var(--meta); font-size:.95rem;
    max-width:400px; margin:0 auto;
  }
  .cat-label{
    font-size:.72rem; font-weight:600; color:var(--meta); text-transform:uppercase;
    letter-spacing:.6px; margin:0 0 8px;
  }
  .headline{
    font-family:'Source Serif 4',serif; font-weight:700; font-size:1.32rem;
    line-height:1.28; margin:0 0 10px;
  }
  .summary{
    font-size:.96rem; line-height:1.62; color:var(--ink); opacity:.88;
    margin:0 0 16px; max-width:64ch;
  }
  .meta-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:auto; font-size:.8rem; color:var(--meta);
  }
  .meta-left{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .source-link{
    color:var(--ink); font-weight:600; text-decoration:none;
    border-bottom:1.5px solid var(--amber); padding-bottom:1px;
  }
  .source-link:hover{ opacity:.75; }
  .progress{
    display:flex; gap:4px; padding:10px 16px 0; max-width:480px; margin:0 auto;
  }
  .progress span{ height:3px; flex:1; background:var(--line); border-radius:2px; overflow:hidden; }
  .progress span i{ display:block; height:100%; width:0; background:var(--ink); }
  .progress span.seen i{ width:100%; }
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <p class="brand">StudyBrief</p>
    <div class="header-actions">
      <button class="load-btn" id="customizeBtn">Customize</button>
      <button class="load-btn" id="loadBtn">Load JSON</button>
      <input type="file" id="fileInput" accept="application/json" style="display:none">
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="pull-indicator" id="pullIndicator">Release to refresh</div>
<div class="progress" id="progress"></div>

<div class="modal-overlay" id="customizeModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Customize your feed</h2>
      <button class="modal-close" id="closeCustomize" aria-label="Close">&times;</button>
    </div>
    <p class="modal-sub">Pick the topics you care about within each category. Leave a category untouched to keep seeing everything in it.</p>
    <div class="modal-body" id="customizeBody"></div>
    <div class="modal-footer">
      <button class="btn-text" id="clearInterests">Clear all filters</button>
      <button class="btn-primary" id="saveInterests">Save</button>
    </div>
  </div>
</div>

<main class="feed" id="feed"></main>
<div class="toast" id="toast"></div>

function thumbArt(catKey){
  return THUMB_ART[catKey] || THUMB_ART.exams;
}

function formatPublished(pub){
  if(!pub) return '';
  const d = new Date(pub);
  if(isNaN(d.getTime())) return '';
  const datePart = d.toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'});
  const timePart = d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  return `${datePart}, ${timePart}`;
}

function dateLabel(c){
  const pub = formatPublished(c.published);
  if(pub) return pub + ' · ';
  // No official publish date from the source (common for notice-board
  // PDFs) — fall back to when this story was added, labeled honestly.
  const added = formatPublished(c.addedOn);
  if(added) return 'Added ' + added + ' · ';
  return '';
}

const API_BASE = "https://educationalnews.onrender.com"; // <-- your live Render API

const CARDS_FROM_PIPELINE_KEY = {
  competitive_exams: "exams",
  govt_jobs: "govt",
  private_jobs: "private",
  courses: "courses",
};

const SUBCATEGORY_LABELS = {
  exams: {
    engineering_entrance: "Engineering Entrance", medical_entrance: "Medical Entrance",
    pg_research: "Postgrad & Research (NET/GATE)", management_entrance: "Management/MBA Entrance",

    media_content: "Media, Content & Journalism", hospitality_pvt: "Hospitality (Private)",
    consulting: "Consulting", internships: "Internships & Fresher Programs",

};

const CATEGORY_HEADINGS = { exams: "Exam", courses: "Course", govt: "Govt Job", private: "Pvt Job" };

// --- Customize / interest filters (saved locally on this device) --------
let selectedInterests = {};
try{
  selectedInterests = JSON.parse(localStorage.getItem('studybrief_interests') || '{}');
}catch(e){ selectedInterests = {}; }
let interestDraft = {};

function saveInterestsToStorage(){
  try{ localStorage.setItem('studybrief_interests', JSON.stringify(selectedInterests)); }
  catch(e){ /* storage unavailable — filter still works for this session */ }
}

function updateCustomizeBadge(){
  const activeCount = Object.values(selectedInterests).filter(arr => arr && arr.length).length;
  document.getElementById('customizeBtn').textContent =
    activeCount ? `Customize (${activeCount})` : 'Customize';
}

function openCustomizeModal(){
  interestDraft = JSON.parse(JSON.stringify(selectedInterests)); // work on a copy
  const body = document.getElementById('customizeBody');
  body.innerHTML = Object.entries(CATEGORY_HEADINGS).map(([catKey, heading])=>{
    const options = SUBCATEGORY_LABELS[catKey] || {};
    const chips = Object.entries(options).map(([slug,label])=>{
      const isSelected = (interestDraft[catKey]||[]).includes(slug);
      return `<button class="interest-chip ${isSelected?'selected':''}" data-cat="${catKey}" data-slug="${slug}">${label}</button>`;
    }).join('');
    return `<div class="interest-group"><h3>${heading}</h3><div class="interest-chips">${chips}</div></div>`;
  }).join('');
  document.getElementById('customizeModal').classList.add('show');
}

function closeCustomizeModal(){
  document.getElementById('customizeModal').classList.remove('show');
}

document.getElementById('customizeBtn').addEventListener('click', openCustomizeModal);
document.getElementById('closeCustomize').addEventListener('click', closeCustomizeModal);
document.getElementById('customizeModal').addEventListener('click', (e)=>{
  if(e.target.id === 'customizeModal') closeCustomizeModal(); // click outside the panel
});

document.getElementById('customizeBody').addEventListener('click', (e)=>{
  const chip = e.target.closest('.interest-chip');
  if(!chip) return;
  const cat = chip.dataset.cat, slug = chip.dataset.slug;
  if(!interestDraft[cat]) interestDraft[cat] = [];
  const idx = interestDraft[cat].indexOf(slug);
  if(idx > -1) interestDraft[cat].splice(idx, 1);
  else interestDraft[cat].push(slug);
  chip.classList.toggle('selected');
});

document.getElementById('saveInterests').addEventListener('click', ()=>{
  selectedInterests = interestDraft;
  saveInterestsToStorage();
  updateCustomizeBadge();
  closeCustomizeModal();
  render();
  showToast("Feed customized");
});

document.getElementById('clearInterests').addEventListener('click', ()=>{
  selectedInterests = {};
  saveInterestsToStorage();
  updateCustomizeBadge();
  closeCustomizeModal();
  render();
  showToast("Filters cleared — showing everything");
});

function matchesInterestFilter(c){
  const sel = selectedInterests[c.cat];
  if(!sel || sel.length === 0) return true;       // no filter set for this category
  if(!c.subcategory) return true;                  // untagged story — never hide it
  return sel.includes(c.subcategory);
}

const CARDS = [...SAMPLE_CARDS];

const tabsEl = document.getElementById('tabs');
const feedEl = document.getElementById('feed');
const progressEl = document.getElementById('progress');
const toastEl = document.getElementById('toast');
const pullIndicator = document.getElementById('pullIndicator');
let activeCat = "all";

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

function mapApiCards(raw){
  return raw.map(item=>{
    const catKey = CARDS_FROM_PIPELINE_KEY[item.category] || item.category || "exams";
    return {
      id: item.id,
      cat: catKey,
      subcategory: item.subcategory || null,
      tag: CATS[catKey] ? CATS[catKey].label : "News",
      color: (CATS[catKey] && CATS[catKey].color) || "#5B5F97",
      headline: item.headline,
      summary: item.summary,
      source: (item.source_link || "").replace(/^https?:\/\//,'').split('/')[0],
      link: item.source_link || "#",
      photo: item.thumbnail_url || null,
      published: item.published_at || null,
      addedOn: item.created_at || null,
    };
  });
}

// --- Live fetch on load (real-time mode) --------------------------------
// Works when this page is hosted outside claude.ai (e.g. Vercel/Netlify),
// where it's free to call your own API. Falls back to sample cards if
// the API isn't reachable yet (e.g. API_BASE not set, or offline).
async function loadLive(){
  if(API_BASE.includes("YOUR-API-NAME")){
    return; // not configured yet — stay on sample data, no error noise
  }
  try{
    const res = await fetch(`${API_BASE}/api/news?limit=50`);
    if(!res.ok) throw new Error(`API returned ${res.status}`);
    const raw = await res.json();
    const mapped = mapApiCards(raw);
    if(mapped.length){
      CARDS.length = 0;
      CARDS.push(...mapped);
      render();
      showToast(`Live: ${mapped.length} stories loaded`);
    }
  }catch(err){
    showToast("Couldn't reach the live API — showing sample stories");
  }
}

// --- Load real pipeline output (news_cards.json) -----------------------
document.getElementById('loadBtn').addEventListener('click', ()=>{
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const raw = JSON.parse(evt.target.result);
      const mapped = mapApiCards(raw);
      CARDS.length = 0;
      CARDS.push(...mapped);
      activeCat = "all";
      render();
      showToast(`Loaded ${mapped.length} stories from file`);
    }catch(err){
      showToast("Couldn't read that file — check it's valid JSON");
    }
  };
  reader.readAsText(file);
});

// --- Pull-to-refresh -----------------------------------------------------
let touchStartY = null;
let pulling = false;

feedEl.addEventListener('touchstart', (e)=>{
  if(feedEl.scrollTop <= 0){ touchStartY = e.touches[0].clientY; }
}, {passive:true});

feedEl.addEventListener('touchmove', (e)=>{
  if(touchStartY === null) return;
  const delta = e.touches[0].clientY - touchStartY;
  if(delta > 60 && feedEl.scrollTop <= 0){
    pulling = true;
    pullIndicator.classList.add('show');
  }
}, {passive:true});

feedEl.addEventListener('touchend', ()=>{
  if(pulling){
    pullIndicator.textContent = "Refreshing...";
    setTimeout(async ()=>{
      await loadLive();
      render();
      pullIndicator.classList.remove('show');
      pullIndicator.textContent = "Release to refresh";
      showToast("Feed refreshed");
    }, 500);
  }
  touchStartY = null;
  pulling = false;
}, {passive:true});

// --- Bookmarks (saved locally on this device) ----------------------------
let bookmarks = new Set();
try{
  bookmarks = new Set(JSON.parse(localStorage.getItem('studybrief_bookmarks') || '[]'));
}catch(e){ /* ignore, start with empty set */ }

function saveBookmarks(){
  try{ localStorage.setItem('studybrief_bookmarks', JSON.stringify([...bookmarks])); }
  catch(e){ /* storage unavailable — bookmark still works for this session */ }
}

function shareCard(c){
  if(navigator.share){
    navigator.share({ title: c.headline, text: c.summary.slice(0,140)+'…', url: c.link })
      .catch(()=>{}); // user cancelled — no error needed
  }else{
    navigator.clipboard.writeText(c.link)
      .then(()=> showToast("Link copied to clipboard"))
      .catch(()=> showToast("Couldn't copy link"));
  }
}

function render(){
  tabsEl.innerHTML = Object.entries(CATS).map(([key,c])=>
    `<button class="tab ${key===activeCat?'active':''}" data-cat="${key}">${c.label}</button>`
  ).join('');

  let visible;
  if(activeCat==="all") visible = CARDS.filter(matchesInterestFilter);
  else if(activeCat==="saved") visible = CARDS.filter(c=>bookmarks.has(String(c.id)));
  else visible = CARDS.filter(c=>c.cat===activeCat && matchesInterestFilter(c));

  progressEl.innerHTML = visible.map(()=>`<span><i></i></span>`).join('');

  if(activeCat==="saved" && visible.length===0){
    feedEl.innerHTML = `<div class="empty-saved">No saved stories yet — tap the bookmark icon on any card to keep it here.</div>`;
    return;
  }

  feedEl.innerHTML = visible.map(c=>{
    const isSaved = bookmarks.has(String(c.id));
    return `
    <article class="card">
      <div class="thumb" style="background:${c.color}">
        ${c.photo ? `<img src="${c.photo}" alt="" class="thumb-photo" onerror="this.outerHTML='${thumbArt(c.cat).replace(/'/g,"&#39;").replace(/\n/g,'')}'">` : thumbArt(c.cat)}
        <div class="thumb-actions">
          <button class="icon-btn ${isSaved?'active':''}" data-action="bookmark" data-id="${c.id}" aria-label="Save">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z" fill="${isSaved?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" data-action="share" data-id="${c.id}" aria-label="Share">
            <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="18" cy="5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="6" cy="12" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="19" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="8.1" y1="10.8" x2="15.9" y2="6.2" stroke="currentColor" stroke-width="1.8"/><line x1="8.1" y1="13.2" x2="15.9" y2="17.8" stroke="currentColor" stroke-width="1.8"/></svg>
          </button>
        </div>
      </div>
      <p class="cat-label">${c.tag}</p>
      <h2 class="headline">${c.headline}</h2>
      <p class="summary">${c.summary}</p>
      <div class="meta-row">
        <span class="meta-left">${dateLabel(c)}${c.source}</span>
        <a class="source-link" href="${c.link}" target="_blank" rel="noopener">Read More</a>
      </div>
    </article>
  `;
  }).join('');

  bindScroll(visible.length);
}

function bindScroll(count){
  const cards = [...feedEl.querySelectorAll('.card')];
  const bars = [...progressEl.querySelectorAll('span')];
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      const idx = cards.indexOf(e.target);
      if(e.isIntersecting && idx>-1) bars[idx].classList.add('seen');
    });
  }, {root:feedEl, threshold:0.6});
  cards.forEach(c=>obs.observe(c));
}

tabsEl.addEventListener('click', e=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  activeCat = btn.dataset.cat;
  render();
});

feedEl.addEventListener('click', e=>{
  const btn = e.target.closest('.icon-btn');
  if(!btn) return;
  const id = String(btn.dataset.id);
  const card = CARDS.find(c => String(c.id) === id);
  if(!card) return;

  if(btn.dataset.action === 'bookmark'){
    if(bookmarks.has(id)){
      bookmarks.delete(id);
    }else{
      bookmarks.add(id);
    }
    saveBookmarks();
    render(); // re-render to update the icon state (and the Saved tab list)
  }else if(btn.dataset.action === 'share'){
    shareCard(card);
  }
});

updateCustomizeBadge();
render();
loadLive();
</script>
</body>
</html>
