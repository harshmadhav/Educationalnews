<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyBrief — Review Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D; --paper:#FAFAF7; --paper-dim:#F0EEE6;
    --amber:#F2A93B; --teal:#1F7A70; --coral:#D9542A;
    --meta:#6B7280; --line:#E4E1D8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F4F2EA; --paper:#12131A; --paper-dim:#1A1C25;
      --meta:#9A9AA5; --line:#2A2C36;
    }
  }
  :root[data-theme="dark"]{
    --ink:#F4F2EA; --paper:#12131A; --paper-dim:#1A1C25;
    --meta:#9A9AA5; --line:#2A2C36;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; }
  header{
    position:sticky; top:0; background:var(--paper); border-bottom:1px solid var(--line);
    padding:16px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  h1{ font-family:'Source Serif 4',serif; font-size:1.25rem; margin:0; }
  .token-row{ display:flex; gap:8px; align-items:center; }
  input[type=password], input[type=text]{
    font-family:inherit; font-size:.85rem; padding:7px 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--paper-dim); color:var(--ink); width:200px;
  }
  .btn{
    font-family:inherit; font-size:.82rem; font-weight:600; border-radius:8px; border:1px solid var(--line);
    padding:7px 14px; cursor:pointer; background:var(--paper-dim); color:var(--ink);
  }
  .btn.primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .btn.approve{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .btn.reject{ background:var(--coral); color:#fff; border-color:var(--coral); }
  .count{ font-size:.85rem; color:var(--meta); }

  main{ max-width:760px; margin:0 auto; padding:20px; display:flex; flex-direction:column; gap:16px; }
  .card{
    border:1px solid var(--line); border-radius:12px; padding:18px; background:var(--paper-dim);
  }
  .thumb{
    height:120px; border-radius:8px; margin-bottom:14px; position:relative; overflow:hidden;
  }
  .thumb-art{ position:absolute; inset:0; width:100%; height:100%; }
  .thumb-photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .thumb-url-input{
    width:100%; font-size:.78rem; color:var(--meta); background:transparent;
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin-bottom:14px;
    font-family:'Inter',sans-serif;
  }
  .thumb-url-input:focus{ border-color:var(--ink); outline:none; color:var(--ink); }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
  .tag{ font-size:.72rem; font-weight:600; color:var(--meta); text-transform:none; }
  .subcat-select{
    width:100%; font-size:.82rem; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin-bottom:10px;
    font-family:'Inter',sans-serif;
  }
  .headline{
    font-family:'Source Serif 4',serif; font-weight:700; font-size:1.1rem; margin:0 0 8px;
    width:100%; border:none; background:transparent; color:var(--ink); font-family:'Source Serif 4',serif;
  }
  textarea{
    width:100%; font-family:'Inter',sans-serif; font-size:.92rem; line-height:1.55; color:var(--ink);
    background:transparent; border:1px solid transparent; border-radius:8px; padding:6px; resize:vertical;
    min-height:100px;
  }
  textarea:focus, .headline:focus{ border-color:var(--line); outline:none; background:var(--paper); }
  .meta{ font-size:.8rem; margin:8px 0 14px; }
  .meta a{ color:var(--meta); text-decoration:none; border-bottom:1px solid var(--line); }
  .meta a:hover{ color:var(--ink); }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .empty{ text-align:center; color:var(--meta); padding:60px 20px; font-size:.95rem; }
</style>
</head>
<body>

<header>
  <h1>Review Queue</h1>
  <div class="token-row">
    <input type="text" id="apiBase" placeholder="API base URL">
    <input type="password" id="tokenInput" placeholder="Admin token">
    <button class="btn primary" id="loadBtn">Load</button>
  </div>
</header>

<main>
  <p class="count" id="count"></p>
  <div id="list"></div>
</main>

<script>
let API_BASE = "";
let TOKEN = "";

const CATS = {
  competitive_exams: { color: "#1F7A70" },
  govt_jobs:          { color: "#D9542A" },
  private_jobs:       { color: "#5B5F97" },
  courses:            { color: "#F2A93B" },
};

const SUBCATEGORY_LABELS = {
  competitive_exams: {
    engineering_entrance: "Engineering Entrance", medical_entrance: "Medical Entrance",
    pg_research: "Postgrad & Research (NET/GATE)", management_entrance: "Management/MBA Entrance",
    law_entrance: "Law Entrance", design_entrance: "Design & Fashion Entrance",
    architecture_entrance: "Architecture Entrance", agriculture_entrance: "Agriculture Entrance",
    hospitality_entrance: "Hotel Management Entrance", university_entrance: "Common University Entrance",
    civil_services_exam: "Civil Services (UPSC CSE)", teaching_eligibility: "Teaching Eligibility",
    school_boards: "School Board Exams", state_entrance: "State-Level Entrance Exams",
  },
  courses: {
    engineering_course: "Engineering & Technology", medical_course: "Medical & Health Sciences",
    it_data_science: "Computer Science / IT / Data Science", management_course: "Management & Business",
    commerce_finance: "Commerce & Finance", law_course: "Law",
    design_arts: "Design & Fine Arts", pure_sciences: "Pure Sciences",
    humanities: "Arts & Humanities", agriculture_course: "Agriculture & Allied Sciences",
    hospitality_course: "Hospitality & Tourism", teacher_training: "Education / Teacher Training",
    vocational_skills: "Skill Development & Vocational", online_courses: "Online / MOOC Courses",
  },
  govt_jobs: {
    banking_govt: "Banking (Public Sector)", railways: "Railways",
    ssc: "SSC (CGL/CHSL/MTS/GD)", defence: "Defence (Army/Navy/Air Force)",
    police_paramilitary: "Police & Paramilitary", civil_services_job: "Civil Services (UPSC)",
    state_psc: "State PSC", teaching_govt: "Teaching (Govt Schools)",
    psu: "PSU Jobs", judiciary: "Judiciary", postal: "Postal Services",
    insurance_govt: "Insurance (LIC/GIC)", healthcare_govt: "Healthcare (Govt)",
    municipal: "Municipal / Local Body",
  },
  private_jobs: {
    it_tech: "IT / Software / Tech", banking_finance_pvt: "Banking & Finance (Private)",
    bpo_kpo: "BPO / KPO / Customer Support", sales_marketing: "Sales & Marketing",
    retail_ecommerce: "Retail & E-commerce", manufacturing: "Manufacturing & Core Engineering",
    startups: "Startups", healthcare_pharma: "Healthcare & Pharma (Private)",
    media_content: "Media, Content & Journalism", hospitality_pvt: "Hospitality (Private)",
    consulting: "Consulting", internships: "Internships & Fresher Programs",
  },
};

const THUMB_ART = {
  competitive_exams: `<svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg" class="thumb-art">
    <rect x="150" y="24" width="110" height="130" rx="6" fill="#fff" opacity="0.14"/>
    <rect x="168" y="44" width="74" height="8" rx="4" fill="#fff" opacity="0.3"/>
    <rect x="168" y="62" width="60" height="6" rx="3" fill="#fff" opacity="0.22"/>
    <rect x="168" y="76" width="60" height="6" rx="3" fill="#fff" opacity="0.22"/>
    <rect x="168" y="90" width="46" height="6" rx="3" fill="#fff" opacity="0.22"/>
    <circle cx="230" cy="122" r="26" fill="#fff" opacity="0.18"/>
    <path d="M218 122l8 8 16-16" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  </svg>`,
  govt_jobs: `<svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg" class="thumb-art">
    <rect x="150" y="120" width="120" height="10" rx="2" fill="#fff" opacity="0.28"/>
    <path d="M158 118v-44l52-24 52 24v44" stroke="#fff" stroke-width="6" fill="none" opacity="0.22" stroke-linejoin="round"/>
    <rect x="166" y="74" width="10" height="44" fill="#fff" opacity="0.2"/>
    <rect x="188" y="74" width="10" height="44" fill="#fff" opacity="0.2"/>
    <rect x="210" y="74" width="10" height="44" fill="#fff" opacity="0.2"/>
    <rect x="232" y="74" width="10" height="44" fill="#fff" opacity="0.2"/>
    <circle cx="210" cy="42" r="10" fill="#fff" opacity="0.3"/>
  </svg>`,
  private_jobs: `<svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg" class="thumb-art">
    <rect x="160" y="76" width="100" height="66" rx="8" fill="#fff" opacity="0.16"/>
    <rect x="190" y="60" width="40" height="20" rx="4" fill="none" stroke="#fff" stroke-width="5" opacity="0.24"/>
    <rect x="160" y="94" width="100" height="8" fill="#fff" opacity="0.12"/>
    <path d="M172 128l20-24 16 14 26-30" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <path d="M222 88h14v14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </svg>`,
  courses: `<svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg" class="thumb-art">
    <path d="M156 96l54-20 54 20-54 20-54-20z" fill="#fff" opacity="0.22"/>
    <path d="M180 106v26c0 6 14 12 30 12s30-6 30-12v-26" stroke="#fff" stroke-width="5" fill="none" opacity="0.24"/>
    <line x1="264" y1="96" x2="264" y2="126" stroke="#fff" stroke-width="4" opacity="0.3"/>
    <rect x="168" y="46" width="72" height="10" rx="5" fill="#fff" opacity="0.16"/>
  </svg>`,
};

function thumbArt(cat){
  return THUMB_ART[cat] || THUMB_ART.competitive_exams;
}

const listEl = document.getElementById('list');
const countEl = document.getElementById('count');

// Remember the last-used values in this browser only (not sent anywhere).
document.getElementById('apiBase').value = localStorage.getItem('sb_api_base') || "";
document.getElementById('tokenInput').value = localStorage.getItem('sb_token') || "";

document.getElementById('loadBtn').addEventListener('click', loadQueue);

async function loadQueue(){
  API_BASE = document.getElementById('apiBase').value.trim().replace(/\/$/,'');
  TOKEN = document.getElementById('tokenInput').value.trim();
  localStorage.setItem('sb_api_base', API_BASE);
  localStorage.setItem('sb_token', TOKEN);

  if(!API_BASE || !TOKEN){
    listEl.innerHTML = `<p class="empty">Enter your API base URL and admin token above.</p>`;
    return;
  }

  listEl.innerHTML = `<p class="empty">Loading…</p>`;
  try{
    const res = await fetch(`${API_BASE}/api/admin/news?status=draft&limit=100`, {
      headers: { "X-Admin-Token": TOKEN }
    });
    if(res.status === 401){
      listEl.innerHTML = `<p class="empty">Token rejected — check it matches ADMIN_TOKEN on your server.</p>`;
      return;
    }
    if(!res.ok) throw new Error(`Server returned ${res.status}`);
    const cards = await res.json();
    render(cards);
  }catch(err){
    listEl.innerHTML = `<p class="empty">Couldn't reach the API. Check the base URL and that your server is running.</p>`;
  }
}

function render(cards){
  countEl.textContent = `${cards.length} story/stories awaiting review`;

  if(cards.length === 0){
    listEl.innerHTML = `<p class="empty">Nothing waiting for review right now.</p>`;
    return;
  }

  listEl.innerHTML = cards.map(c => {
    const color = (CATS[c.category] && CATS[c.category].color) || "#5B5F97";
    const thumbInner = c.thumbnail_url
      ? `<img src="${c.thumbnail_url}" alt="" class="thumb-photo" onerror="this.outerHTML='${thumbArt(c.category).replace(/'/g,"&#39;").replace(/\n/g,'')}'">`
      : thumbArt(c.category);
    return `
    <div class="card" data-id="${c.id}">
      <div class="thumb" style="background:${color}" data-thumb-preview>${thumbInner}</div>
      <input class="thumb-url-input" data-field="thumbnail_url" placeholder="Paste an image URL to override the thumbnail"
             value="${escapeAttr(c.thumbnail_url || '')}">
      <div class="card-top">
        <span class="tag">${c.category} · ${c.source_domain || ''}</span>
      </div>
      <select class="subcat-select" data-field="subcategory">
        <option value="">— No sub-interest tag —</option>
        ${Object.entries(SUBCATEGORY_LABELS[c.category] || {}).map(([slug,label])=>
          `<option value="${slug}" ${c.subcategory===slug?'selected':''}>${label}</option>`
        ).join('')}
      </select>
      <input class="headline" value="${escapeAttr(c.headline)}" data-field="headline">
      <textarea data-field="summary">${c.summary}</textarea>
      <p class="meta"><a href="${c.source_link}" target="_blank" rel="noopener">View original source ↗</a></p>
      <div class="actions">
        <button class="btn approve" data-action="approve">Approve</button>
        <button class="btn reject" data-action="reject">Reject</button>
        <button class="btn" data-action="save">Save edits</button>
      </div>
    </div>
  `;
  }).join('');

  // Live-preview the thumbnail as the URL field is edited, so you can
  // see the change before saving.
  listEl.querySelectorAll('.thumb-url-input').forEach(input => {
    input.addEventListener('input', () => {
      const cardEl = input.closest('.card');
      const category = cardEl.querySelector('.tag').textContent.split(' · ')[0];
      const preview = cardEl.querySelector('[data-thumb-preview]');
      const url = input.value.trim();
      preview.innerHTML = url
        ? `<img src="${url}" alt="" class="thumb-photo" onerror="this.outerHTML='${thumbArt(category).replace(/'/g,"&#39;").replace(/\n/g,'')}'">`
        : thumbArt(category);
    });
  });
}

function escapeAttr(s){
  return (s || "").replace(/"/g, "&quot;");
}

listEl.addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const cardEl = btn.closest('.card');
  const id = cardEl.dataset.id;
  const action = btn.dataset.action;

  btn.disabled = true;
  try{
    if(action === 'approve'){
      await fetch(`${API_BASE}/api/admin/news/${id}/approve`, {
        method:'POST', headers:{ "X-Admin-Token": TOKEN }
      });
      cardEl.remove();
    } else if(action === 'reject'){
      await fetch(`${API_BASE}/api/admin/news/${id}/reject`, {
        method:'POST', headers:{ "X-Admin-Token": TOKEN }
      });
      cardEl.remove();
    } else if(action === 'save'){
      const headline = cardEl.querySelector('[data-field=headline]').value;
      const summary = cardEl.querySelector('[data-field=summary]').value;
      const thumbnail_url = cardEl.querySelector('[data-field=thumbnail_url]').value.trim() || null;
      const subcategory = cardEl.querySelector('[data-field=subcategory]').value || null;
      await fetch(`${API_BASE}/api/admin/news/${id}`, {
        method:'PATCH',
        headers:{ "X-Admin-Token": TOKEN, "Content-Type":"application/json" },
        body: JSON.stringify({ headline, summary, thumbnail_url, subcategory })
      });
    }
  }catch(err){
    alert("Action failed — check your connection and try again.");
  }
  btn.disabled = false;

  const remaining = listEl.querySelectorAll('.card').length;
  countEl.textContent = `${remaining} story/stories awaiting review`;
});
</script>
</body>
</html>
