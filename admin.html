<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyBrief — Review Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14213D; --paper:#FAFAF7; --paper-dim:#F0EEE6;
    --amber:#F2A93B; --teal:#1F7A70; --coral:#D9542A;
    --meta:#6B7280; --line:#E4E1D8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F4F2EA; --paper:#12131A; --paper-dim:#1A1C25;
      --meta:#9A9AA5; --line:#2A2C36;
    }
  }
  :root[data-theme="dark"]{
    --ink:#F4F2EA; --paper:#12131A; --paper-dim:#1A1C25;
    --meta:#9A9AA5; --line:#2A2C36;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; }
  header{
    position:sticky; top:0; background:var(--paper); border-bottom:1px solid var(--line);
    padding:16px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  h1{ font-family:'Source Serif 4',serif; font-size:1.25rem; margin:0; }
  .token-row{ display:flex; gap:8px; align-items:center; }
  .status-tabs{ display:flex; gap:6px; margin-top:12px; }
  .status-tab{
    font-size:.82rem; font-weight:600; padding:6px 14px; border-radius:16px;
    border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer;
    font-family:inherit;
  }
  .status-tab.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .admin-search{
    width:100%; max-width:400px; margin-top:12px; font-size:.88rem; color:var(--ink);
    background:var(--paper-dim); border:1px solid var(--line); border-radius:18px;
    padding:8px 14px; font-family:'Inter',sans-serif; box-sizing:border-box;
  }
  .admin-search:focus{ outline:none; border-color:var(--ink); background:var(--paper); }
  input[type=password], input[type=text]{
    font-family:inherit; font-size:.85rem; padding:7px 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--paper-dim); color:var(--ink); width:200px;
  }
  .btn{
    font-family:inherit; font-size:.82rem; font-weight:600; border-radius:8px; border:1px solid var(--line);
    padding:7px 14px; cursor:pointer; background:var(--paper-dim); color:var(--ink);
  }
  .btn.primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .btn.approve{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .btn.reject{ background:var(--coral); color:#fff; border-color:var(--coral); }
  .count{ font-size:.85rem; color:var(--meta); }

  main{ max-width:760px; margin:0 auto; padding:20px; display:flex; flex-direction:column; gap:16px; }
  .card{
    border:1px solid var(--line); border-radius:12px; padding:18px; background:var(--paper-dim);
  }
  .thumb{
    height:120px; border-radius:8px; margin-bottom:14px; position:relative; overflow:hidden;
  }
  .thumb-art{ position:absolute; inset:0; width:100%; height:100%; }
  .thumb-photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .thumb-url-input{
    width:100%; font-size:.78rem; color:var(--meta); background:transparent;
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin-bottom:14px;
    font-family:'Inter',sans-serif;
  }
  .thumb-url-input:focus{ border-color:var(--ink); outline:none; color:var(--ink); }
  .thumb-tools{ display:flex; gap:14px; margin-bottom:14px; }
  .thumb-tools .btn-text{ font-size:.76rem; padding:0; }
  .upload-label{ cursor:pointer; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
  .tag{ font-size:.72rem; font-weight:600; color:var(--meta); text-transform:none; }
  .category-select{
    font-size:.78rem; font-weight:700; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:14px; padding:4px 10px;
    font-family:'Inter',sans-serif;
  }
  .source-domain-note{ font-size:.75rem; color:var(--meta); padding-top:5px; }
  .subcat-select{
    width:100%; font-size:.82rem; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin-bottom:10px;
    font-family:'Inter',sans-serif;
  }
  .deadline-inline-label{
    display:flex; align-items:center; gap:8px; font-size:.78rem; color:var(--meta);
    margin-bottom:10px;
  }
  .deadline-input{
    font-size:.82rem; color:var(--ink); background:var(--paper); border:1px solid var(--line);
    border-radius:6px; padding:5px 7px; font-family:'Inter',sans-serif;
  }
  .headline{
    font-family:'Source Serif 4',serif; font-weight:700; font-size:1.1rem; margin:0 0 8px;
    width:100%; border:none; background:transparent; color:var(--ink); font-family:'Source Serif 4',serif;
  }
  textarea{
    width:100%; font-family:'Inter',sans-serif; font-size:.92rem; line-height:1.55; color:var(--ink);
    background:transparent; border:1px solid transparent; border-radius:8px; padding:6px; resize:vertical;
    min-height:100px;
  }
  textarea:focus, .headline:focus{ border-color:var(--line); outline:none; background:var(--paper); }
  .meta{ font-size:.8rem; margin:8px 0 14px; }
  .meta a{ color:var(--meta); text-decoration:none; border-bottom:1px solid var(--line); }
  .meta a:hover{ color:var(--ink); }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .empty{ text-align:center; color:var(--meta); padding:60px 20px; font-size:.95rem; }

  /* --- Compose modal --- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,33,61,.5);
    z-index:50; align-items:flex-start; justify-content:center; overflow-y:auto; padding:30px 16px;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    background:var(--paper); width:100%; max-width:520px; border-radius:14px;
    padding:22px; box-sizing:border-box;
  }
  .modal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .modal-header h2{ font-size:1.15rem; margin:0; }
  .modal-close{
    background:none; border:none; font-size:1.4rem; line-height:1; cursor:pointer;
    color:var(--meta); padding:0 4px;
  }
  .form-label{
    display:block; font-size:.8rem; font-weight:600; color:var(--ink);
    margin:14px 0 6px;
  }
  .form-hint{ font-weight:400; color:var(--meta); }
  .form-input, .form-textarea{
    width:100%; font-size:.9rem; color:var(--ink); background:var(--paper-dim);
    border:1px solid var(--line); border-radius:8px; padding:9px 10px;
    box-sizing:border-box; font-family:inherit;
  }
  .form-textarea{ min-height:130px; resize:vertical; line-height:1.5; }
  .compose-thumb-preview{
    height:0; overflow:hidden; border-radius:8px; margin-bottom:0; transition:height .15s;
  }
  .compose-thumb-preview:has(img){ height:140px; margin-bottom:8px; }
  .compose-thumb-preview img{ width:100%; height:100%; object-fit:cover; border-radius:8px; }
  .sponsor-toggle-row{ margin-top:16px; }
  .sponsor-checkbox-label{
    display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--ink); cursor:pointer;
  }
  .advertiser-fields{ margin-top:2px; }
  .form-input:focus, .form-textarea:focus{ outline:none; border-color:var(--ink); background:var(--paper); }
  .modal-footer{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:18px; padding-top:14px; border-top:1px solid var(--line);
  }
  .btn-text{
    background:none; border:none; color:var(--meta); font-size:.85rem;
    cursor:pointer; font-family:inherit; text-decoration:underline;
  }
  .btn-primary{
    background:var(--ink); color:var(--paper); border:none; border-radius:20px;
    padding:9px 22px; font-size:.9rem; font-weight:600; cursor:pointer; font-family:inherit;
  }
</style>
</head>
<body>

<header>
  <h1>Review Queue</h1>
  <div class="token-row">
    <input type="text" id="apiBase" placeholder="API base URL">
    <input type="password" id="tokenInput" placeholder="Admin token">
    <button class="btn primary" id="loadBtn">Load</button>
    <button class="btn" id="composeBtn">Write News</button>
  </div>
  <div class="status-tabs" id="statusTabs">
    <button class="status-tab active" data-status="draft">Draft</button>
    <button class="status-tab" data-status="published">Published</button>
    <button class="status-tab" data-status="archived">Archived</button>
  </div>
  <input type="text" id="adminSearch" class="admin-search" placeholder="Search headline or summary...">
</header>

<div class="modal-overlay" id="composeModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Write a new story</h2>
      <button class="modal-close" id="closeCompose" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <label class="form-label">Headline</label>
      <input type="text" id="composeHeadline" class="form-input" placeholder="Short, clear headline">

      <label class="form-label">Content <span id="composeWordCount">(0 words — aim for ~100)</span></label>
      <textarea id="composeContent" class="form-textarea" placeholder="Write the story here, simple and factual"></textarea>

      <label class="form-label">Category</label>
      <select id="composeCategory" class="form-input">
        <option value="competitive_exams">Exam</option>
        <option value="govt_jobs">Govt Job</option>
        <option value="private_jobs">Pvt Job</option>
        <option value="courses">Course</option>
        <option value="news">News</option>
      </select>

      <label class="form-label">Sub-interest tag</label>
      <select id="composeSubcategory" class="form-input"></select>

      <label class="form-label">Article or video link <span class="form-hint">(the source readers will open)</span></label>
      <input type="text" id="composeLink" class="form-input" placeholder="https://...">

      <label class="form-label">Application deadline <span class="form-hint">(optional — shows an urgency badge in the app)</span></label>
      <input type="date" id="composeDeadline" class="form-input">

      <label class="form-label">Thumbnail <span class="form-hint">(optional — leave blank to use the category icon)</span></label>
      <div class="compose-thumb-preview" id="composeThumbPreview"></div>
      <input type="text" id="composeThumbnail" class="form-input" placeholder="Paste an image URL...">
      <div class="thumb-tools">
        <label class="btn-text upload-label">Upload photo
          <input type="file" accept="image/*" id="composeFileInput" hidden>
        </label>
        <button class="btn-text" type="button" id="composeYtFetchBtn">Fetch thumbnail from video link</button>
      </div>

      <div class="sponsor-toggle-row">
        <label class="sponsor-checkbox-label">
          <input type="checkbox" id="composeSponsored">
          This is a sponsored / affiliate post
        </label>
      </div>
      <div id="advertiserFields" class="advertiser-fields" style="display:none">
        <label class="form-label">Advertiser / brand name <span class="form-hint">(shown next to the "Ad" label)</span></label>
        <input type="text" id="composeAdvertiser" class="form-input" placeholder="e.g. upGrad">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-text" id="saveDraftBtn">Save as draft</button>
      <button class="btn-primary" id="publishNowBtn">Publish now</button>
    </div>
  </div>
</div>

<main>
  <p class="count" id="count"></p>
  <div id="list"></div>
</main>

// Fetches admin-added sub-interest tags and merges them into
// SUBCATEGORY_LABELS in place, so every dropdown that already reads
// from this object picks them up automatically.
async function loadCustomSubcategories(){
  if(!API_BASE) return;
  try{
    const res = await fetch(`${API_BASE}/api/subcategories`);
    if(!res.ok) return;
    const items = await res.json();
    items.forEach(item => {
      if(!SUBCATEGORY_LABELS[item.category]) SUBCATEGORY_LABELS[item.category] = {};
      SUBCATEGORY_LABELS[item.category][item.slug] = item.label;
    });
  }catch(e){ /* offline or server down — dropdowns just use the built-in list */ }
}

function slugify(label){
  return label.trim().toLowerCase()
    .replace(/[^a-z0-9\s-]/g, '')
    .replace(/[\s-]+/g, '_')
    .slice(0, 60);
}

// Builds the <option> list for a subcategory <select>, always starting
// with "None" and ending with "+ Add new sub-category".
function buildSubcatOptionsHTML(category, selectedSlug){
  const options = SUBCATEGORY_LABELS[category] || {};
  return `<option value="">None</option>` +
    Object.entries(options).map(([slug,label])=>
      `<option value="${slug}" ${selectedSlug===slug?'selected':''}>${label}</option>`
    ).join('') +
    `<option value="__add_new__">+ Add new sub-category…</option>`;
}

// Shared handler: attach to any subcategory <select>'s "change" event.
// Prompts for a new tag's name when "+ Add new sub-category" is picked,
// saves it to the server, and selects it once added.
async function handleSubcatSelectChange(select){
  if(select.value !== '__add_new__') return;
  const category = select.dataset.category || select.closest('.card')?.querySelector('.category-select')?.value
                    || document.getElementById('composeCategory')?.value;
  const label = prompt("Name the new sub-interest tag (e.g. \"Merchant Navy Entrance\"):");
  if(!label || !label.trim()){
    select.value = ''; // cancelled — fall back to "None"
    return;
  }
  const slug = slugify(label);
  if(!slug){
    alert("That name didn't produce a usable tag — try letters and numbers.");
    select.value = '';
    return;
  }
  try{
    await fetch(`${API_BASE}/api/admin/subcategories`, {
      method: 'POST',
      headers: { "X-Admin-Token": TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify({ category, slug, label: label.trim() }),
    });
    if(!SUBCATEGORY_LABELS[category]) SUBCATEGORY_LABELS[category] = {};
    SUBCATEGORY_LABELS[category][slug] = label.trim();
    select.innerHTML = buildSubcatOptionsHTML(category, slug);
  }catch(err){
    alert(`Couldn't save the new tag: ${err.message}`);
    select.value = '';
  }
}

function thumbArt(cat){
  return THUMB_ART[cat] || THUMB_ART.competitive_exams;
}

const listEl = document.getElementById('list');
const countEl = document.getElementById('count');

// Remember the last-used values in this browser only (not sent anywhere).
document.getElementById('apiBase').value = localStorage.getItem('sb_api_base') || "";
document.getElementById('tokenInput').value = localStorage.getItem('sb_token') || "";

document.getElementById('loadBtn').addEventListener('click', loadQueue);

document.getElementById('statusTabs').addEventListener('click', (e)=>{
  const tab = e.target.closest('.status-tab');
  if(!tab) return;
  document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentStatus = tab.dataset.status;
  loadQueue();
});

let currentStatus = 'draft';
let allCards = [];

async function loadQueue(){
  API_BASE = document.getElementById('apiBase').value.trim().replace(/\/$/,'');
  TOKEN = document.getElementById('tokenInput').value.trim();
  localStorage.setItem('sb_api_base', API_BASE);
  localStorage.setItem('sb_token', TOKEN);

  if(!API_BASE || !TOKEN){
    listEl.innerHTML = `<p class="empty">Enter your API base URL and admin token above.</p>`;
    return;
  }

  await loadCustomSubcategories();

  listEl.innerHTML = `<p class="empty">Loading…</p>`;
  try{
    const res = await fetch(`${API_BASE}/api/admin/news?status=${currentStatus}&limit=100`, {
      headers: { "X-Admin-Token": TOKEN }
    });
    if(res.status === 401){
      listEl.innerHTML = `<p class="empty">Token rejected — check it matches ADMIN_TOKEN on your server.</p>`;
      return;
    }
    if(!res.ok) throw new Error(`Server returned ${res.status}`);
    const cards = await res.json();
    allCards = cards;
    applySearchFilter();
  }catch(err){
    listEl.innerHTML = `<p class="empty">Couldn't reach the API. Check the base URL and that your server is running.</p>`;
  }
}

function applySearchFilter(){
  const query = document.getElementById('adminSearch').value.trim().toLowerCase();
  const filtered = !query ? allCards : allCards.filter(c =>
    c.headline.toLowerCase().includes(query) || c.summary.toLowerCase().includes(query)
  );
  render(filtered);
}

document.getElementById('adminSearch').addEventListener('input', applySearchFilter);

function statusCountLabel(n){
  const noun = currentStatus === 'draft' ? 'awaiting review'
             : currentStatus === 'published' ? 'live in the app'
             : 'archived';
  return `${n} story/stories ${noun}`;
}

function render(cards){
  countEl.textContent = statusCountLabel(cards.length);

  if(cards.length === 0){
    listEl.innerHTML = `<p class="empty">Nothing here right now.</p>`;
    return;
  }

  listEl.innerHTML = cards.map(c => {
    const color = (CATS[c.category] && CATS[c.category].color) || "#5B5F97";
    const thumbInner = c.thumbnail_url
      ? `<img src="${c.thumbnail_url}" alt="" class="thumb-photo" onerror="this.outerHTML='${thumbArt(c.category).replace(/'/g,"&#39;").replace(/\n/g,'')}'">`
      : thumbArt(c.category);
    return `
    <div class="card" data-id="${c.id}">
      <div class="thumb" style="background:${color}" data-thumb-preview>${thumbInner}</div>
      <input class="thumb-url-input" data-field="thumbnail_url" placeholder="Paste an image URL to override the thumbnail"
             value="${escapeAttr(c.thumbnail_url || '')}">
      <div class="thumb-tools">
        <label class="btn-text upload-label">Upload photo
          <input type="file" accept="image/*" class="thumb-file-input" hidden>
        </label>
        <button class="btn-text yt-fetch-btn" type="button">Fetch thumbnail from video link</button>
      </div>
      <div class="card-top">
        <select class="category-select" data-field="category">
          ${Object.entries(CATEGORY_LABELS).map(([slug,label])=>
            `<option value="${slug}" ${c.category===slug?'selected':''}>${label}</option>`
          ).join('')}
        </select>
        <span class="source-domain-note">${c.source_domain || ''}</span>
      </div>
      <select class="subcat-select" data-field="subcategory" data-category="${c.category}">
        ${buildSubcatOptionsHTML(c.category, c.subcategory)}
      </select>
      <label class="deadline-inline-label">Deadline <input type="date" class="deadline-input" data-field="deadline" value="${c.deadline || ''}"></label>
      <label class="deadline-inline-label">Published <input type="date" class="deadline-input" data-field="published_at" value="${toDateInputValue(c.published_at)}"></label>
      <input class="headline" value="${escapeAttr(c.headline)}" data-field="headline">
      <textarea data-field="summary">${c.summary}</textarea>
      <p class="meta"><a href="${c.source_link}" target="_blank" rel="noopener">View original source ↗</a></p>
      <div class="actions">
        ${currentStatus === 'draft' ? `
          <button class="btn approve" data-action="approve">Approve</button>
          <button class="btn reject" data-action="reject">Reject</button>
        ` : currentStatus === 'published' ? `
          <button class="btn reject" data-action="unpublish">Unpublish</button>
        ` : `
          <button class="btn approve" data-action="unpublish">Restore to draft</button>
        `}
        <button class="btn" data-action="save">Save edits</button>
      </div>
    </div>
  `;
  }).join('');

  // Live-preview the thumbnail as the URL field is edited, so you can
  // see the change before saving.
  function refreshThumbPreview(cardEl, category, url){
    const preview = cardEl.querySelector('[data-thumb-preview]');
    preview.innerHTML = url
      ? `<img src="${url}" alt="" class="thumb-photo" onerror="this.outerHTML='${thumbArt(category).replace(/'/g,"&#39;").replace(/\n/g,'')}'">`
      : thumbArt(category);
  }

  listEl.querySelectorAll('.category-select').forEach(select => {
    select.addEventListener('change', () => {
      const cardEl = select.closest('.card');
      const newCategory = select.value;
      const subcatSelect = cardEl.querySelector('.subcat-select');
      // Category changed — the old sub-interest tag likely doesn't belong
      // to the new category's list, so reset it rather than keep a
      // mismatched value.
      subcatSelect.dataset.category = newCategory;
      subcatSelect.innerHTML = buildSubcatOptionsHTML(newCategory, null);
    });
  });

  listEl.querySelectorAll('.subcat-select').forEach(select => {
    select.addEventListener('change', () => handleSubcatSelectChange(select));
  });

  listEl.querySelectorAll('.thumb-url-input').forEach(input => {
    input.addEventListener('input', () => {
      const cardEl = input.closest('.card');
      const category = cardEl.querySelector('.category-select').value;
      refreshThumbPreview(cardEl, category, input.value.trim());
    });
  });

  listEl.querySelectorAll('.thumb-file-input').forEach(fileInput => {
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      const cardEl = fileInput.closest('.card');
      const category = cardEl.querySelector('.category-select').value;
      const urlInput = cardEl.querySelector('.thumb-url-input');
      try{
        const dataUrl = await resizeImageFile(file);
        urlInput.value = dataUrl;
        refreshThumbPreview(cardEl, category, dataUrl);
      }catch(err){
        alert("Couldn't process that image — try a different file.");
      }
    });
  });

  listEl.querySelectorAll('.yt-fetch-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const cardEl = btn.closest('.card');
      const category = cardEl.querySelector('.category-select').value;
      const urlInput = cardEl.querySelector('.thumb-url-input');
      const sourceLink = cardEl.querySelector('.meta a').href;
      const ytThumb = getYouTubeThumbnail(sourceLink);
      if(!ytThumb){
        alert("That story's source link doesn't look like a YouTube video.");
        return;
      }
      urlInput.value = ytThumb;
      refreshThumbPreview(cardEl, category, ytThumb);
    });
  });
}

function toDateInputValue(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return ''; // unparseable — leave the field blank rather than guess
  return d.toISOString().slice(0, 10);
}

function escapeAttr(s){
  return (s || "").replace(/"/g, "&quot;");
}

// Resizes/compresses an uploaded image to keep it small enough to store
// as a data URI directly in the database — no separate file storage
// needed. Targets ~1200px wide, JPEG at 75% quality.
function resizeImageFile(file, maxWidth=1200, maxHeight=675, quality=0.75){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const scale = Math.min(maxWidth / width, maxHeight / height, 1);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Extracts a YouTube video ID from common URL formats and returns
// YouTube's own hosted thumbnail for it, or null if not a YouTube link.
function getYouTubeThumbnail(url){
  const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);
  return match ? `https://img.youtube.com/vi/${match[1]}/hqdefault.jpg` : null;
}

listEl.addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const cardEl = btn.closest('.card');
  const id = cardEl.dataset.id;
  const action = btn.dataset.action;

  btn.disabled = true;
  try{
    if(action === 'approve'){
      await fetch(`${API_BASE}/api/admin/news/${id}/approve`, {
        method:'POST', headers:{ "X-Admin-Token": TOKEN }
      });
      cardEl.remove();
    } else if(action === 'reject'){
      await fetch(`${API_BASE}/api/admin/news/${id}/reject`, {
        method:'POST', headers:{ "X-Admin-Token": TOKEN }
      });
      cardEl.remove();
    } else if(action === 'unpublish'){
      await fetch(`${API_BASE}/api/admin/news/${id}/unpublish`, {
        method:'POST', headers:{ "X-Admin-Token": TOKEN }
      });
      cardEl.remove();
      alert("Moved back to Draft — edit it there, then Approve to republish.");
    } else if(action === 'save'){
      const headline = cardEl.querySelector('[data-field=headline]').value;
      const summary = cardEl.querySelector('[data-field=summary]').value;
      const thumbnail_url = cardEl.querySelector('[data-field=thumbnail_url]').value.trim() || null;
      const category = cardEl.querySelector('[data-field=category]').value;
      const subcategory = cardEl.querySelector('[data-field=subcategory]').value || null;
      const deadline = cardEl.querySelector('[data-field=deadline]').value || null;
      const published_at = cardEl.querySelector('[data-field=published_at]').value || null;
      const saveRes = await fetch(`${API_BASE}/api/admin/news/${id}`, {
        method:'PATCH',
        headers:{ "X-Admin-Token": TOKEN, "Content-Type":"application/json" },
        body: JSON.stringify({ headline, summary, thumbnail_url, category, subcategory, deadline, published_at })
      });
      if(!saveRes.ok){
        const errText = await saveRes.text();
        throw new Error(`Server rejected the save (${saveRes.status}): ${errText}`);
      }
      const saved = await saveRes.json();
      if(saved.category !== category){
        alert(`Warning: server kept the category as "${saved.category}" instead of "${category}" — check for a typo or constraint issue.`);
      }else{
        alert("Saved.");
      }
      loadQueue(); // reload from the server so what you see matches what's actually stored
    }
  }catch(err){
    alert(`Action failed: ${err.message}\n\nCheck the browser console (F12) for more detail.`);
    console.error("Admin action failed:", err);
  }
  btn.disabled = false;

  const remaining = listEl.querySelectorAll('.card').length;
  countEl.textContent = statusCountLabel(remaining);
});

// --- Write News (compose + publish original stories) ---------------------

function populateComposeSubcategories(){
  const category = document.getElementById('composeCategory').value;
  const select = document.getElementById('composeSubcategory');
  select.dataset.category = category;
  select.innerHTML = buildSubcatOptionsHTML(category, null);
}

document.getElementById('composeCategory').addEventListener('change', populateComposeSubcategories);
document.getElementById('composeSubcategory').addEventListener('change', (e) => handleSubcatSelectChange(e.target));

document.getElementById('composeContent').addEventListener('input', (e)=>{
  const words = e.target.value.trim().split(/\s+/).filter(Boolean).length;
  document.getElementById('composeWordCount').textContent = `(${words} words — aim for ~100)`;
});

document.getElementById('composeBtn').addEventListener('click', async ()=>{
  if(!API_BASE || !TOKEN){
    alert("Enter your API URL and admin token at the top first, then click Load.");
    return;
  }
  await loadCustomSubcategories();
  populateComposeSubcategories();
  document.getElementById('composeModal').classList.add('show');
});

document.getElementById('closeCompose').addEventListener('click', ()=>{
  document.getElementById('composeModal').classList.remove('show');
});
document.getElementById('composeModal').addEventListener('click', (e)=>{
  if(e.target.id === 'composeModal') document.getElementById('composeModal').classList.remove('show');
});

function refreshComposePreview(){
  const url = document.getElementById('composeThumbnail').value.trim();
  const preview = document.getElementById('composeThumbPreview');
  preview.innerHTML = url ? `<img src="${url}" alt="" onerror="this.style.display='none'">` : '';
}

document.getElementById('composeThumbnail').addEventListener('input', refreshComposePreview);

document.getElementById('composeFileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await resizeImageFile(file);
    document.getElementById('composeThumbnail').value = dataUrl;
    refreshComposePreview();
  }catch(err){
    alert("Couldn't process that image — try a different file.");
  }
});

document.getElementById('composeYtFetchBtn').addEventListener('click', () => {
  const link = document.getElementById('composeLink').value.trim();
  const ytThumb = getYouTubeThumbnail(link);
  if(!ytThumb){
    alert("Enter a YouTube video link above first.");
    return;
  }
  document.getElementById('composeThumbnail').value = ytThumb;
  refreshComposePreview();
});

function clearComposeForm(){
  document.getElementById('composeHeadline').value = '';
  document.getElementById('composeContent').value = '';
  document.getElementById('composeWordCount').textContent = '(0 words — aim for ~100)';
  document.getElementById('composeLink').value = '';
  document.getElementById('composeThumbnail').value = '';
  document.getElementById('composeDeadline').value = '';
  document.getElementById('composeSponsored').checked = false;
  document.getElementById('composeAdvertiser').value = '';
  document.getElementById('advertiserFields').style.display = 'none';
  refreshComposePreview();
}

document.getElementById('composeSponsored').addEventListener('change', (e)=>{
  document.getElementById('advertiserFields').style.display = e.target.checked ? 'block' : 'none';
});

async function submitComposedStory(publishImmediately){
  const headline = document.getElementById('composeHeadline').value.trim();
  const summary = document.getElementById('composeContent').value.trim();
  const category = document.getElementById('composeCategory').value;
  const subcategory = document.getElementById('composeSubcategory').value || null;
  const source_link = document.getElementById('composeLink').value.trim();
  const thumbnail_url = document.getElementById('composeThumbnail').value.trim() || null;
  const deadline = document.getElementById('composeDeadline').value || null;
  const is_sponsored = document.getElementById('composeSponsored').checked;
  const sponsor_name = is_sponsored
    ? (document.getElementById('composeAdvertiser').value.trim() || null)
    : null;

  if(!headline || !summary || !source_link){
    alert("Headline, content, and the article/video link are all required.");
    return;
  }
  if(is_sponsored && !sponsor_name){
    alert("Enter the advertiser/brand name for sponsored posts — required for proper disclosure.");
    return;
  }

  const btn = publishImmediately
    ? document.getElementById('publishNowBtn')
    : document.getElementById('saveDraftBtn');
  btn.disabled = true;

  try{
    const createRes = await fetch(`${API_BASE}/api/news`, {
      method: 'POST',
      headers: { "X-Admin-Token": TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify({
        category, subcategory, headline, summary, source_link, thumbnail_url,
        is_original: !is_sponsored, is_sponsored, sponsor_name, deadline,
      }),
    });
    if(!createRes.ok) throw new Error(`Server returned ${createRes.status}`);
    const created = await createRes.json();

    if(publishImmediately){
      await fetch(`${API_BASE}/api/admin/news/${created.id}/approve`, {
        method: 'POST', headers: { "X-Admin-Token": TOKEN },
      });
    }

    document.getElementById('composeModal').classList.remove('show');
    clearComposeForm();
    alert(publishImmediately ? "Published — it's now live in the app." : "Saved as a draft in your review queue.");
    if(!publishImmediately) loadQueue(); // refresh so the new draft shows up
  }catch(err){
    alert(`Couldn't save the story: ${err.message}`);
  }
  btn.disabled = false;
}

document.getElementById('saveDraftBtn').addEventListener('click', ()=> submitComposedStory(false));
document.getElementById('publishNowBtn').addEventListener('click', ()=> submitComposedStory(true));
</script>
